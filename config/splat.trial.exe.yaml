# TRIAL.EXE mission editor: shared engine modules and editor-specific recovery.
# Whole-image equality remains the gate while assembly stubs become readable C.
options:
  platform: psx
  basename: trial.exe
  base_path: ..
  build_path: .shake/build/trial.exe
  target_path: disks/tenchu/trial.exe
  asm_path: .shake/gen/trial.exe/asm
  asset_path: .shake/gen/trial.exe/assets
  src_path: .shake/gen/trial.exe/src
  compiler: GCC
  find_file_boundaries: no
  use_legacy_include_asm: no
  migrate_rodata_to_functions: no
  # include/{macro,labels,gte_macros}.inc and include_asm.h are checked-in sources
  # (config/splat.main.exe.yaml documents how to regenerate them). Six configs all
  # writing them would race; nobody writes them.
  generate_asm_macros_files: no
  gp_value: 0x800970b0
  ld_script_path: .shake/gen/trial.exe/linker/trial.exe.ld
  symbol_addrs_path: config/symbols.trial.exe.txt
  undefined_funcs_auto_path: .shake/gen/trial.exe/meta/undefined_functions_auto.trial.exe.txt
  undefined_syms_auto_path: .shake/gen/trial.exe/meta/undefined_symbols_auto.trial.exe.txt
  generated_c_preamble: |
    #include "common.h"
  string_encoding: ASCII
  section_order:
    - .text
    - .rodata
    - .data
    - .sdata
    - .sbss
    - .bss

segments:
  - [0x800, header]
  - name: trial_exe
    type: code
    align: 4
    start: 0x00000800
    vram: 0x80011000
    subalign: 4
    subsegments:
      - [0x800, textbin]
      - { start: 0x854, type: .rodata, name: MENULIST, linker_section_order: .text }
      - { start: 0x8a4, type: .rodata, name: PREVIEW, linker_section_order: .text }
      - { start: 0xad4, type: .rodata, name: DrawTrialMissionList, linker_section_order: .text }
      - { start: 0xb28, type: .rodata, name: LoadTrialConfirmationGraphics, linker_section_order: .text }
