      # the compiler's intervening alignment word.
      - { start: 0x2E64, type: .rodata, name: CHRANIM, linker_section_order: .data }
      - [0x2EB0, data]
      # BriefingAndInventorySelectionScreen's switch jump table (vram
      # 0x80013B30): linked from the C object's .rodata so the compiled table
      # lands at the original address (the raw data bin is split around it).
      - { start: 0x3330, type: .rodata, name: BriefingAndInventorySelectionScreen, linker_section_order: .data }
      - { start: 0x33B0, type: .rodata, name: game_over_screen_, linker_section_order: .data }
      - [0x33C4, data]
      # decode_tmd_fast_'s 29-entry primitive-type jump table (vram 0x80013C20).
